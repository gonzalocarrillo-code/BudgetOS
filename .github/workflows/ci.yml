name: ci

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # T-025: the read-only MCP import guard (no database needed; ADR-019).
      - run: pnpm --filter @budget/mcp exec vitest run --root . --config vitest.config.mjs src/import-guard.test.ts
