name: ci

permissions:
  contents: read

on:
  pull_request:
  push:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # T-025: the read-only MCP import guard (no database needed; ADR-019).
      - run: pnpm --filter @budget/mcp exec vitest run --root . --config vitest.config.mjs src/import-guard.test.ts

  # W0-1 (audit M-1, S-8): the full suite, with Postgres/Redis/GCS exactly like docker-compose.yml,
  # so a push to main only deploys once this job is green (see deploy.yml's workflow_run trigger).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # W0-6 (audit S-2, S-3, S-21): DATABASE_URL is budget_owner — non-superuser, NOBYPASSRLS,
      # created by scripts/db-init.sql below — not the postgres service's own superuser
      # (POSTGRES_USER budget), matching production's owner. Placeholder role passwords from
      # packages/db/.env.example (migrations 0001_roles, 20260924070000, 20260925020000 create
      # the three login roles themselves via `pnpm db:migrate`).
      DATABASE_URL: postgresql://budget_owner:budget_owner@127.0.0.1:5432/budget
      APP_DATABASE_URL: postgresql://budget_app:replace-in-secret-manager@127.0.0.1:5432/budget
      PUBLISHER_DATABASE_URL: postgresql://budget_publisher:replace-in-secret-manager@127.0.0.1:5432/budget
      MCP_DATABASE_URL: postgresql://budget_mcp:replace-in-secret-manager@127.0.0.1:5432/budget
      GCS_EMULATOR_HOST: http://127.0.0.1:4443
      REDIS_URL: redis://127.0.0.1:6379
      # ADR-073: GitHub runners are slower than the laptop baseline every timing budget in
      # apps/api's suites assumes; every such assertion scales through test-support/perf.ts.
      # Product gates (e.g. T-006's 60 s) are unchanged locally and in `pnpm bench`.
      PERF_BUDGET_SCALE: "3"
      VITEST_MAX_WORKERS: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/db/src/datastream.test.ts reads packages/db/.env directly (unlike
      # test-support/harness.ts, which guards with existsSync); local dev always has this file
      # (copied from .env.example), so CI needs it too. Values match the job env above.
      - run: cp packages/db/.env.example packages/db/.env
      # ADR-011: same image/flags as docker-compose.yml's gcs service. GitHub Actions service
      # containers cannot take a command, so start it directly instead of as a `services:` entry.
      - name: fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 fsouza/fake-gcs-server:1.52.2 \
            -scheme http -port 4443 -public-host 127.0.0.1:4443 -backend memory
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4443/storage/v1/b || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
      # W0-6: creates budget_owner (non-superuser, NOBYPASSRLS, CREATEROLE, CREATEDB) and makes it
      # the owner of the `budget` database, as the postgres service's own superuser — the same
      # script docker-compose.yml mounts into /docker-entrypoint-initdb.d/ for local dev. GitHub
      # Actions starts service containers before checkout, so this runs it by hand instead of
      # relying on the entrypoint. Everything after this runs as budget_owner (DATABASE_URL above).
      - run: psql "postgresql://budget:budget@127.0.0.1:5432/budget" -v ON_ERROR_STOP=1 -f scripts/db-init.sql
      - run: pnpm --filter @budget/db exec prisma generate
      - run: pnpm db:migrate
      - run: pnpm exec turbo run test --env-mode=loose --concurrency=1
      - run: pnpm license-check
      # S-8 fix-list item: `pnpm audit` currently finds known high advisories (Fastify, lodash,
      # toml, js-yaml — see audit S-8) that W2-6 is responsible for fixing. Non-blocking until then;
      # W2-6 must flip this to blocking (remove continue-on-error) once those are resolved.
      - name: pnpm audit (non-blocking until W2-6)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
