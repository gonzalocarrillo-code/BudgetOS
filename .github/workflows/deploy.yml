name: deploy

# ADR-065: every push to main builds one image and deploys Budget OS to the dmus-gonzalo project.
# GitHub signs in through the budgetos-github workload identity pool (this repository only) as
# budgetos-deployer, whose Cloud Run rights are limited to resources named budgetos-*.
# Order: image → budgetos-migrate (migrations + bootstrap) → app, slack, worker.
# The four resources, IAP on budgetos-app, who may pass it and the public invoker of budgetos-slack
# were created once by hand (docs/runbooks/deploy.md): the deployer may only update budgetos-*
# resources, and a deploy never changes their access.
#
# W0-1 (audit M-1): deploys only after the `ci` workflow is green on main (workflow_run), so a red
# CI run never ships. `workflow_dispatch` still redeploys by hand regardless of CI state.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: dmus-gonzalo
  PROJECT_NUMBER: "666309304754"
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/dmus-gonzalo/budgetos/budgetos
  RUNTIME_SA: budgetos-runtime@dmus-gonzalo.iam.gserviceaccount.com
  SQL: dmus-gonzalo:us-central1:budgetos-db
  SUPERADMIN_EMAIL: gonzalo.carrillo@deptagency.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # workflow_dispatch always runs; a workflow_run only runs (and deploys) when ci succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Commit to deploy
        run: echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # ADR-067: with a Google OAuth client in Secret Manager, Budget OS signs people in itself (any
      # Google account) and budgetos-app is public; without one it stays behind IAP (ADR-065).
      - name: Sign-in mode
        run: |
          if [ -n "$(gcloud secrets versions list budgetos-google-oauth-client-secret --project "$PROJECT" --filter=state=enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then
            echo "AUTH_MODE=session" >> "$GITHUB_ENV"
            echo "AUTH_ENV=AUTH_MODE=session" >> "$GITHUB_ENV"
            echo "AUTH_SECRETS=,SESSION_KEY=budgetos-session-key:latest,GOOGLE_OAUTH_CLIENT_ID=budgetos-google-oauth-client-id:latest,GOOGLE_OAUTH_CLIENT_SECRET=budgetos-google-oauth-client-secret:latest" >> "$GITHUB_ENV"
          else
            echo "AUTH_MODE=iap" >> "$GITHUB_ENV"
            echo "AUTH_ENV=AUTH_MODE=iap,AUTH_AUDIENCE=/projects/$PROJECT_NUMBER/locations/$REGION/services/budgetos-app" >> "$GITHUB_ENV"
            echo "AUTH_SECRETS=" >> "$GITHUB_ENV"
          fi
      - name: Build and push the image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --build-arg WEB_AUTH_MODE="$AUTH_MODE" -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
      - name: Optional secrets (Slack, OpenAI) that have a value
        run: |
          optional=""
          for pair in SLACK_BOT_TOKEN=budgetos-slack-bot-token SLACK_SIGNING_SECRET=budgetos-slack-signing-secret OPENAI_API_KEY=budgetos-openai-api-key; do
            secret="${pair#*=}"
            if [ -n "$(gcloud secrets versions list "$secret" --project "$PROJECT" --filter=state=enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then optional="$optional,$pair:latest"; fi
          done
          echo "OPTIONAL_SECRETS=$optional" >> "$GITHUB_ENV"
      - name: Migrate and bootstrap
        run: |
          gcloud run jobs deploy budgetos-migrate --project "$PROJECT" --region "$REGION" --image "$IMAGE:$SHA" \
            --service-account "$RUNTIME_SA" --set-cloudsql-instances "$SQL" --max-retries 0 --task-timeout 900s --memory 1Gi \
            --set-secrets "DATABASE_URL=budgetos-database-url:latest,APP_DATABASE_URL=budgetos-app-database-url:latest,APP_DB_PASSWORD=budgetos-db-app-password:latest,PUBLISHER_DB_PASSWORD=budgetos-db-publisher-password:latest,MCP_DB_PASSWORD=budgetos-db-mcp-password:latest" \
            --set-env-vars "SUPERADMIN_EMAIL=$SUPERADMIN_EMAIL,ORG_NAME=DEPT" \
            --command sh --args="-c,cd /app && apps/api/node_modules/.bin/tsx apps/api/src/deploy/bootstrap.ts --check-secrets && pnpm --filter @budget/db exec prisma migrate deploy && apps/api/node_modules/.bin/tsx apps/api/src/deploy/bootstrap.ts"
          gcloud run jobs execute budgetos-migrate --project "$PROJECT" --region "$REGION" --wait
      # budgetos-slack keeps one instance warm: Slack gives a button 3 seconds, and a cold start
      # (tsx compiling the API) takes 25–30.
      - name: Deploy the app (behind IAP), the Slack endpoint and the worker
        run: |
          APP_URL="https://budgetos-app-$PROJECT_NUMBER.$REGION.run.app"
          SLACK_URL="https://budgetos-slack-$PROJECT_NUMBER.$REGION.run.app"
          COMMON="GOOGLE_CLOUD_PROJECT=$PROJECT,UPLOAD_BUCKET=dmus-gonzalo-budgetos-uploads,CLOSURE_DATASET=budgetos_closures,APP_BASE_URL=$APP_URL,API_PUBLIC_URL=$SLACK_URL"
          # W1-5 (#142): previews live in Postgres, so the app scales horizontally again (audit I-5).
          gcloud run deploy budgetos-app --project "$PROJECT" --region "$REGION" --image "$IMAGE:$SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" \
            --cpu 1 --memory 1Gi --min-instances 0 --max-instances 3 --timeout 300 \
            --set-secrets "APP_DATABASE_URL=budgetos-app-database-url:latest,MCP_OAUTH_KEY=budgetos-mcp-oauth-key:latest$AUTH_SECRETS$OPTIONAL_SECRETS" \
            --set-env-vars "$COMMON,$AUTH_ENV"
          gcloud run deploy budgetos-slack --project "$PROJECT" --region "$REGION" --image "$IMAGE:$SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" \
            --cpu 1 --memory 1Gi --min-instances 1 --max-instances 2 --timeout 60 --cpu-boost \
            --set-secrets "APP_DATABASE_URL=budgetos-app-database-url:latest$OPTIONAL_SECRETS" \
            --set-env-vars "$COMMON,PUBLIC_ROUTES=slack,AUTH_MODE=iap,AUTH_AUDIENCE=/projects/$PROJECT_NUMBER/locations/$REGION/services/budgetos-app"
          gcloud run deploy budgetos-worker --project "$PROJECT" --region "$REGION" --image "$IMAGE:$SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" --ingress internal \
            --cpu 1 --memory 1Gi --min-instances 1 --max-instances 1 --no-cpu-throttling \
            --set-secrets "PUBLISHER_DATABASE_URL=budgetos-publisher-database-url:latest,APP_DATABASE_URL=budgetos-app-database-url:latest$OPTIONAL_SECRETS" \
            --set-env-vars "$COMMON,LISTEN_HOST=0.0.0.0,LOCAL_WORKSPACE_PREFIX=,PACING_EVERY_MS=900000" \
            --command sh --args="-c,cd /app/apps/workers && node_modules/.bin/tsx src/local-runner.ts"
      # Started from apps/api: tsx applies a tsconfig only to the files it includes, and the auth
      # code the MCP server imports from @budget/api needs the API's decorator settings.
      - name: Deploy the MCP server (public, OAuth; ADR-066)
        run: |
          gcloud run deploy budgetos-mcp --project "$PROJECT" --region "$REGION" --image "$IMAGE:$SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" \
            --cpu 1 --memory 1Gi --min-instances 0 --max-instances 2 --timeout 300 \
            --set-secrets "MCP_DATABASE_URL=budgetos-mcp-database-url:latest,MCP_OAUTH_KEY=budgetos-mcp-oauth-key:latest" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT,UPLOAD_BUCKET=dmus-gonzalo-budgetos-uploads,APP_BASE_URL=https://budgetos-app-$PROJECT_NUMBER.$REGION.run.app,MCP_PUBLIC_URL=https://budgetos-mcp-$PROJECT_NUMBER.$REGION.run.app" \
            --command sh --args="-c,cd /app/apps/api && node_modules/.bin/tsx ../mcp/src/main.ts"
