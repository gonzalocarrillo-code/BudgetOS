name: deploy

# ADR-065: every push to main builds one image and deploys Budget OS to the dmus-gonzalo project.
# GitHub signs in through the budgetos-github workload identity pool (this repository only) as
# budgetos-deployer, whose Cloud Run rights are limited to resources named budgetos-*.
# Order: image → budgetos-migrate (migrations + bootstrap) → app, slack, worker.
# The four resources, IAP on budgetos-app, who may pass it and the public invoker of budgetos-slack
# were created once by hand (docs/runbooks/deploy.md): the deployer may only update budgetos-*
# resources, and a deploy never changes their access.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: dmus-gonzalo
  PROJECT_NUMBER: "666309304754"
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/dmus-gonzalo/budgetos/budgetos
  RUNTIME_SA: budgetos-runtime@dmus-gonzalo.iam.gserviceaccount.com
  SQL: dmus-gonzalo:us-central1:budgetos-db
  SUPERADMIN_EMAIL: gonzalo.carrillo@deptagency.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
      - name: Optional secrets (Slack, OpenAI) that have a value
        run: |
          optional=""
          for pair in SLACK_BOT_TOKEN=budgetos-slack-bot-token SLACK_SIGNING_SECRET=budgetos-slack-signing-secret OPENAI_API_KEY=budgetos-openai-api-key; do
            secret="${pair#*=}"
            if [ -n "$(gcloud secrets versions list "$secret" --project "$PROJECT" --filter=state=enabled --limit=1 --format='value(name)' 2>/dev/null)" ]; then optional="$optional,$pair:latest"; fi
          done
          echo "OPTIONAL_SECRETS=$optional" >> "$GITHUB_ENV"
      - name: Migrate and bootstrap
        run: |
          gcloud run jobs deploy budgetos-migrate --project "$PROJECT" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --set-cloudsql-instances "$SQL" --max-retries 0 --task-timeout 900s --memory 1Gi \
            --set-secrets "DATABASE_URL=budgetos-database-url:latest,APP_DB_PASSWORD=budgetos-db-app-password:latest,PUBLISHER_DB_PASSWORD=budgetos-db-publisher-password:latest,MCP_DB_PASSWORD=budgetos-db-mcp-password:latest" \
            --set-env-vars "SUPERADMIN_EMAIL=$SUPERADMIN_EMAIL,ORG_NAME=DEPT" \
            --command sh --args="-c,cd /app && pnpm --filter @budget/db exec prisma migrate deploy && apps/api/node_modules/.bin/tsx apps/api/src/deploy/bootstrap.ts"
          gcloud run jobs execute budgetos-migrate --project "$PROJECT" --region "$REGION" --wait
      - name: Deploy the app (behind IAP), the Slack endpoint and the worker
        run: |
          APP_URL="https://budgetos-app-$PROJECT_NUMBER.$REGION.run.app"
          SLACK_URL="https://budgetos-slack-$PROJECT_NUMBER.$REGION.run.app"
          COMMON="GOOGLE_CLOUD_PROJECT=$PROJECT,UPLOAD_BUCKET=dmus-gonzalo-budgetos-uploads,CLOSURE_DATASET=budgetos_closures,APP_BASE_URL=$APP_URL,API_PUBLIC_URL=$SLACK_URL"
          gcloud run deploy budgetos-app --project "$PROJECT" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" \
            --cpu 1 --memory 1Gi --min-instances 0 --max-instances 3 --timeout 300 \
            --set-secrets "APP_DATABASE_URL=budgetos-app-database-url:latest$OPTIONAL_SECRETS" \
            --set-env-vars "$COMMON,AUTH_MODE=iap,AUTH_AUDIENCE=/projects/$PROJECT_NUMBER/locations/$REGION/services/budgetos-app"
          gcloud run deploy budgetos-slack --project "$PROJECT" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" \
            --cpu 1 --memory 1Gi --min-instances 0 --max-instances 2 --timeout 60 \
            --set-secrets "APP_DATABASE_URL=budgetos-app-database-url:latest$OPTIONAL_SECRETS" \
            --set-env-vars "$COMMON,PUBLIC_ROUTES=slack,AUTH_MODE=iap,AUTH_AUDIENCE=/projects/$PROJECT_NUMBER/locations/$REGION/services/budgetos-app"
          gcloud run deploy budgetos-worker --project "$PROJECT" --region "$REGION" --image "$IMAGE:$GITHUB_SHA" \
            --service-account "$RUNTIME_SA" --add-cloudsql-instances "$SQL" --ingress internal \
            --cpu 1 --memory 1Gi --min-instances 1 --max-instances 1 --no-cpu-throttling \
            --set-secrets "DATABASE_URL=budgetos-database-url:latest,APP_DATABASE_URL=budgetos-app-database-url:latest$OPTIONAL_SECRETS" \
            --set-env-vars "$COMMON,LISTEN_HOST=0.0.0.0,LOCAL_WORKSPACE_PREFIX=,PACING_EVERY_MS=900000" \
            --command sh --args="-c,cd /app/apps/workers && node_modules/.bin/tsx src/local-runner.ts"
